<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 260px; padding: 16px; font-family: system-ui, sans-serif; }
    h2 { font-size: 14px; margin: 0 0 8px; }
    .status { margin-bottom: 8px; font-weight: bold; }
    .on { color: #1a7f37; }
    .off { color: #cf222e; }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #1a73e8;
      color: white;
      margin-bottom: 12px;
    }
    button:hover { background: #1557b0; }
    hr { border: none; border-top: 1px solid #ddd; margin: 12px 0; }
    .colors { display: flex; gap: 8px; justify-content: center; }
    .swatch {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid #ccc; cursor: pointer;
      transition: opacity 0.15s;
    }
    .swatch.active { border-color: #1a73e8; }
    .hint { font-size: 11px; color: #666; margin-top: 8px; }
    .mode-group { display: flex; gap: 8px; margin-bottom: 8px; }
    .mode-btn {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      border: 2px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #333;
      cursor: pointer;
      margin-bottom: 0;
    }
    .mode-btn.active {
      border-color: #1a73e8;
      background: #e8f0fe;
      color: #1a73e8;
      font-weight: bold;
    }
    .mode-desc { font-size: 11px; color: #666; margin-bottom: 12px; min-height: 28px; }
  </style>
</head>
<body>
  <h2>YouTube German Filter</h2>
  <div class="status" id="status">Loading...</div>
  <button id="toggleBtn">Toggle</button>

  <div class="mode-group">
    <button class="mode-btn" id="modeStrict" data-mode="strict">Strict</button>
    <button class="mode-btn" id="modeBalanced" data-mode="balanced">Balanced</button>
  </div>
  <div class="mode-desc" id="modeDesc"></div>

  <hr />

  <h2>Text Highlighter</h2>
  <div class="status" id="hlStatus">Loading...</div>
  <button id="hlToggleBtn">Toggle</button>

  <div class="colors">
    <div class="swatch" data-color="#ffff00" style="background:#ffff00" title="Yellow"></div>
    <div class="swatch" data-color="#a0e7a0" style="background:#a0e7a0" title="Green"></div>
    <div class="swatch" data-color="#a0c4ff" style="background:#a0c4ff" title="Blue"></div>
  </div>
  <div class="hint">Select any text to highlight it instantly with this color.</div>

  <script src="popup.js"></script>
</body>
</html>
